services:
  - type: web
    name: barber-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: daphne config.asgi:application --bind 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: barber-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: barber-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://barber-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://barber-frontend.onrender.com

  - type: static
    name: barber-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://barber-backend.onrender.com/api
      - key: VITE_WS_URL
        value: wss://barber-backend.onrender.com

databases:
  - name: barber-db
    databaseName: barber_db
    user: barber_user
    plan: free
